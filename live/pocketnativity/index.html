		<title>Pocket Nativity</title>
		<style>
:root {
	--sky-top: #162B5C;
	--sky-bottom: #091229;
	--clear-color: #0D1B3E;
	--frame-border: rgba(255, 224, 150, 0.24);
}

html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	touch-action: none;
	color: #fff8e7;
	background-color: var(--sky-bottom);
	background-image:
		radial-gradient(1.5px 1.5px at 8% 14%, rgba(255, 250, 224, 0.90) 50%, transparent 100%),
		radial-gradient(1px 1px at 18% 42%, rgba(255, 255, 255, 0.65) 50%, transparent 100%),
		radial-gradient(2px 2px at 24% 78%, rgba(255, 234, 178, 0.78) 50%, transparent 100%),
		radial-gradient(1.5px 1.5px at 12% 86%, rgba(210, 228, 255, 0.72) 50%, transparent 100%),
		radial-gradient(1px 1px at 31% 22%, rgba(255, 255, 255, 0.60) 50%, transparent 100%),
		radial-gradient(2px 2px at 74% 18%, rgba(255, 244, 212, 0.88) 50%, transparent 100%),
		radial-gradient(1.5px 1.5px at 88% 34%, rgba(214, 232, 255, 0.75) 50%, transparent 100%),
		radial-gradient(1px 1px at 79% 62%, rgba(255, 255, 255, 0.62) 50%, transparent 100%),
		radial-gradient(2px 2px at 92% 76%, rgba(255, 228, 165, 0.80) 50%, transparent 100%),
		radial-gradient(1.5px 1.5px at 83% 89%, rgba(255, 255, 255, 0.70) 50%, transparent 100%),
		radial-gradient(circle at top, #162B5C 0%, #091229 100%);
	background-repeat: no-repeat;
	background-size: cover;
	display: flex;
	align-items: center;
	justify-content: center;
}

#stage-shell {
	position: relative;
	display: flex;
	align-items: center;
	justify-content: center;
	width: 100%;
	height: 100%;
	background-color: var(--clear-color);
	overflow: hidden;
}

body.is-desktop-framed #stage-shell {
	border-radius: 18px;
	border: 1px solid var(--frame-border);
	box-shadow:
		0 22px 64px rgba(2, 6, 18, 0.68),
		0 0 36px rgba(34, 72, 152, 0.26),
		inset 0 0 0 1px rgba(255, 255, 255, 0.06);
}

#canvas {
	display: block;
	margin: 0;
	padding: 0;
	border: 0;
	width: 100% !important;
	height: 100% !important;
	background-color: var(--clear-color);
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 2;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 56%;
	margin: 0 auto;
	accent-color: #f4d06f;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 3;
}

			<canvas id="canvas" width="1080" height="1920">
				Your browser does not support the canvas tag.
			</canvas>

			<noscript>
				Your browser does not support JavaScript.
			</noscript>

			<div id="status">
				<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
				<progress id="status-progress"></progress>
				<div id="status-notice"></div>
			</div>
		</div>

		<script>
(function () {
	const trackedContexts = new Set();

	function wrapAudioContextCtor(OriginalCtor) {
		if (typeof OriginalCtor !== 'function' || OriginalCtor.__pnWrapped) {
			return OriginalCtor;
		}
		const WrappedCtor = function () {
			const ctx = new OriginalCtor(...arguments);
			try {
				trackedContexts.add(ctx);
			} catch (_err) {}
			return ctx;
		};
		WrappedCtor.prototype = OriginalCtor.prototype;
		Object.setPrototypeOf(WrappedCtor, OriginalCtor);
		WrappedCtor.__pnWrapped = true;
		return WrappedCtor;
	}

	if (typeof window.AudioContext === 'function') {
		window.AudioContext = wrapAudioContextCtor(window.AudioContext);
	}
	if (typeof window.webkitAudioContext === 'function') {
		window.webkitAudioContext = wrapAudioContextCtor(window.webkitAudioContext);
	}

	function resumeAllAudioContexts() {
		trackedContexts.forEach(function (ctx) {
			if (!ctx || typeof ctx.resume !== 'function') {
				return;
			}
			try {
				if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
					const p = ctx.resume();
					if (p && typeof p.catch === 'function') {
						p.catch(function () {});
					}
				}
			} catch (_err) {}
		});
	}

	window.__pnAudioContexts = trackedContexts;
	window.__pnUnlockWebAudio = resumeAllAudioContexts;

	window.addEventListener('pointerdown', resumeAllAudioContexts, { capture: true, passive: true });
	window.addEventListener('pointerup', resumeAllAudioContexts, { capture: true, passive: true });
	window.addEventListener('touchstart', resumeAllAudioContexts, { capture: true, passive: true });
	window.addEventListener('touchend', resumeAllAudioContexts, { capture: true, passive: true });
	window.addEventListener('keydown', resumeAllAudioContexts, { capture: true, passive: true });
	window.addEventListener('click', resumeAllAudioContexts, { capture: true, passive: true });
})();

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":68516220,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
GODOT_CONFIG['canvasResizePolicy'] = 0;
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const stageShell = document.getElementById('stage-shell');
	const canvas = document.getElementById('canvas');
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	const TARGET_ASPECT = 9.0 / 16.0;

	function isMobileDevice() {
		const ua = navigator.userAgent || '';
		const touchCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
		return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (touchCoarse && Math.min(window.innerWidth, window.innerHeight) <= 920);
	}

	function tryLockPortrait() {
		if (!isMobileDevice()) {
			return;
		}
		try {
			if (window.screen && window.screen.orientation && typeof window.screen.orientation.lock === 'function') {
				const lockPromise = window.screen.orientation.lock('portrait');
				if (lockPromise && typeof lockPromise.catch === 'function') {
					lockPromise.catch(function () {});
				}
			}
		} catch (_err) {
			// Ignored safely on browsers requiring fullscreen or unsupported devices.
		}
	}

	function updateStageLayout() {
		const vw = Math.max(1, window.innerWidth);
		const vh = Math.max(1, window.innerHeight);
		const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
		const portraitOrMobile = isMobileDevice() || vw <= vh * 0.85;

		let cssW = vw;
		let cssH = vh;

		if (portraitOrMobile) {
			document.body.classList.remove('is-desktop-framed');
		} else {
			document.body.classList.add('is-desktop-framed');
			const margin = vh >= 720 ? 28 : 12;
			cssH = Math.max(320, vh - margin);
			cssW = Math.round(cssH * TARGET_ASPECT);
			if (cssW > vw - margin) {
				cssW = Math.max(240, vw - margin);
				cssH = Math.round(cssW / TARGET_ASPECT);
			}
		}

		stageShell.style.width = cssW + 'px';
		stageShell.style.height = cssH + 'px';

		const targetBufW = Math.max(2, Math.round(cssW * dpr));
		const targetBufH = Math.max(2, Math.round(cssH * dpr));
		if (canvas.width !== targetBufW || canvas.height !== targetBufH) {
			canvas.width = targetBufW;
			canvas.height = targetBufH;
		}
	}

	updateStageLayout();
	tryLockPortrait();
	window.addEventListener('resize', updateStageLayout);
	window.addEventListener('orientationchange', function () {
		setTimeout(updateStageLayout, 60);
		tryLockPortrait();
	});
	window.addEventListener('pointerdown', tryLockPortrait, { once: true, passive: true });
	window.addEventListener('touchstart', tryLockPortrait, { once: true, passive: true });

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;

		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			updateStageLayout();
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
